  <!-- legend -->
  <g transform="translate(92,516)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#1F6FB2" stroke-width="2" stroke-dasharray="9 5"/>
    <text x="46" y="5" class="leg">fL node lines — 22.4% from each short end</text>
    <line x1="0" y1="27" x2="34" y2="27" stroke="#C0561F" stroke-width="2" stroke-dasharray="9 5"/>
    <text x="46" y="32" class="leg">fC node lines — 22.4% from each long edge</text>
    <line x1="0" y1="54" x2="34" y2="54" stroke="#3E8E41" stroke-width="2" stroke-dasharray="14 4 3 4"/>
    <text x="46" y="59" class="leg">fLC node lines — the 50% centrelines</text>
    <circle cx="17" cy="88" r="8.5" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="46" y="93" class="leg">Hold — on the target mode's node, and on the</text>
    <text x="46" y="112" class="leg">orthogonal mode's anti-node. Hold the face, as close</text>
    <text x="46" y="131" class="leg">to the edge as possible: the edge is that anti-node,</text>
    <text x="46" y="150" class="leg">so the damping is strongest there.</text>
    <circle cx="17" cy="182" r="10" fill="none" stroke="#C0392B" stroke-width="2.6"/>
    <circle cx="17" cy="182" r="4.2" fill="#C0392B"/>
    <text x="46" y="187" class="leg">Tap — at an anti-node of the target mode</text>
    <text x="0" y="222" class="note">The fLC tap sits where the fL and fC node lines cross,</text>
    <text x="0" y="240" class="note">so it excites neither bending mode — only the twist.</text>
  </g>
